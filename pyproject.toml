[project]
name = "web-garden-thing"
version = "0.1.0"
description = "Procedural botanical modelling in Blender"
readme = "README.md"
authors = [
    { name = "Alina McLean", email = "ri.mcl@icloud.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
web-garden-thing = "web_garden_thing:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fake-bpy-module==20261031",
    "ruff>=0.17.5,<0.18",
]

[tool.pyright]
extraPaths = ["src"]
include = ["src", "tests", "run_blender.py"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
